# Test configuration - use H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=Oracle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable file upload directory creation during tests
app.upload.dir=${java.io.tmpdir}/revplay-test-uploads

# JWT config (dummy values for tests)
jwt.secret=dGVzdHNlY3JldGtleWZvcnRlc3RpbmdwdXJwb3NlczEyMzQ1Njc4OTAxMjM0NTY=
jwt.expiration=3600000
