<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — RevPlay</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="auth-page">
        <div class="auth-card">
            <div class="auth-logo">
                <a href="/" class="logo" style="justify-content:center;">
                    <img th:src="@{/images/logo.png}" alt="Logo"
                        style="width: 32px; height: 32px; border-radius: 4px; filter: invert(1);"> RevPlay
                </a>
            </div>

            <div id="resetError" class="hidden"
                style="background:rgba(255,111,111,0.06);border:1px solid rgba(255,111,111,0.2);border-radius:var(--radius-sm);padding:0.7rem 0.9rem;margin-bottom:1rem;font-size:0.8rem;color:#ff8888;">
            </div>
            <div id="resetSuccess" class="hidden"
                style="background:rgba(111,255,111,0.06);border:1px solid rgba(111,255,111,0.2);border-radius:var(--radius-sm);padding:0.7rem 0.9rem;margin-bottom:1rem;font-size:0.8rem;color:#88ff88;">
                Password reset successfully! You can now <a href="/login"
                    style="color:white;text-decoration:underline;">login</a>.
            </div>

            <form id="step1Form" onsubmit="handleStep1(event)">
                <p style="text-align:center;color:var(--text-3);margin-bottom:1.5rem;font-size:0.9rem;">Enter your email
                    to reset your password.</p>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="resetEmail" class="form-control" placeholder="you@email.com" required>
                </div>
                <button type="submit" class="btn btn-primary" id="step1Btn">Continue</button>
            </form>

            <form id="step2Form" class="hidden" onsubmit="handleStep2(event)">
                <div class="form-group">
                    <label>Security Question</label>
                    <div id="securityQuestionText"
                        style="padding:0.75rem;background:var(--bg-3);border-radius:var(--radius-sm);color:var(--text-1);margin-bottom:0.5rem;font-weight:500;">
                        Loading...</div>
                </div>
                <div class="form-group">
                    <label>Your Answer</label>
                    <input type="password" id="securityAnswer" class="form-control" placeholder="Enter your answer"
                        required>
                </div>
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="newPassword" class="form-control" placeholder="Min. 6 characters"
                        required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary" id="step2Btn">Reset Password</button>
            </form>

            <div class="auth-footer" id="backToLogin">
                Remembered your password? <a href="/login">Back to login</a>
            </div>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
    <script>
        var pendingEmail = '';

        async function handleStep1(e) {
            e.preventDefault();
            var email = document.getElementById('resetEmail').value.trim();
            var errorBox = document.getElementById('resetError');
            var btn = document.getElementById('step1Btn');

            errorBox.classList.add('hidden');
            btn.textContent = 'Checking...';
            btn.disabled = true;

            try {
                var data = await api('/api/users/email/' + encodeURIComponent(email));
                if (data && data.securityQuestion) {
                    pendingEmail = email;
                    document.getElementById('securityQuestionText').textContent = data.securityQuestion;
                    document.getElementById('step1Form').classList.add('hidden');
                    document.getElementById('step2Form').classList.remove('hidden');
                } else {
                    errorBox.textContent = 'No security question found for this user.';
                    errorBox.classList.remove('hidden');
                }
            } catch (err) {
                errorBox.textContent = (err.message && err.message.includes('404')) ? 'Account not found.' : 'Error fetching account.';
                errorBox.classList.remove('hidden');
            }
            btn.textContent = 'Continue';
            btn.disabled = false;
        }

        async function handleStep2(e) {
            e.preventDefault();
            var answer = document.getElementById('securityAnswer').value.trim();
            var newPassword = document.getElementById('newPassword').value;
            var errorBox = document.getElementById('resetError');
            var successBox = document.getElementById('resetSuccess');
            var btn = document.getElementById('step2Btn');

            errorBox.classList.add('hidden');
            btn.textContent = 'Resetting...';
            btn.disabled = true;

            try {
                var res = await fetch('/api/users/reset-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: pendingEmail, securityAnswer: answer, newPassword: newPassword })
                });
                if (res.ok) {
                    document.getElementById('step2Form').classList.add('hidden');
                    successBox.classList.remove('hidden');
                    document.getElementById('backToLogin').style.display = 'none';
                } else {
                    errorBox.textContent = 'Incorrect security answer or server error.';
                    errorBox.classList.remove('hidden');
                }
            } catch (err) {
                errorBox.textContent = 'Connection error. Try again.';
                errorBox.classList.remove('hidden');
            }
            btn.textContent = 'Reset Password';
            btn.disabled = false;
        }
    </script>
</body>

</html>
