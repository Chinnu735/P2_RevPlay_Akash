<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — RevPlay</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script>if (!localStorage.getItem('user')) window.location.replace('/login');</script>
    <style>
        /* ── Profile Avatar Upload Area ──────────────────────────── */
        .avatar-upload-wrap {
            position: relative;
            width: 110px;
            height: 110px;
            flex-shrink: 0;
            cursor: pointer;
        }

        .avatar-upload-wrap .profile-avatar {
            width: 110px;
            height: 110px;
            font-size: 2.5rem;
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-3);
            color: var(--text-2);
            font-weight: 700;
            border: 3px solid var(--border-2);

        }

        .avatar-upload-wrap:hover .profile-avatar {
            border-color: var(--accent);
        }


        .avatar-upload-wrap .avatar-edit-overlay {
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);

            pointer-events: none;
        }

        .avatar-upload-wrap:hover .avatar-edit-overlay {
            background: var(--accent-hover, var(--accent));
        }

        .avatar-upload-wrap input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        /* ── Upload Progress ─────────────────────────────────────── */
        .pic-upload-bar {
            height: 3px;
            border-radius: 2px;
            background: var(--bg-3);
            margin-top: 6px;
            overflow: hidden;
            display: none;
        }

        .pic-upload-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--accent);
            transition: width 0.3s;
        }
    </style>
</head>

<body class="">

    <nav class="navbar">
        <a href="/home" class="logo">
            <img th:src="@{/images/logo.png}" alt="Logo"
                style="width: 32px; height: 32px; border-radius: 4px; filter: invert(1);"> RevPlay
        </a>
        <div class="nav-links" id="navLinks">
            <a href="/home">Home</a>
            <a href="/browse">Browse</a>
            <a href="/podcasts">Podcasts</a>
            <a href="/playlists">Playlists</a>
            <a href="/favorites">Favorites</a>
            <a href="/artist-dashboard" id="dashboardLink">Dashboard</a>
        </div>
        <div class="nav-search">
            <input type="text" id="searchInput" name="search" placeholder="Search songs..."
                onkeydown="if(event.key==='Enter') handleUniversalSearch(this.value)">
        </div>
        <div class="nav-actions"><a href="/profile" class="user-avatar active" id="userAvatar">U</a></div>
        <button class="menu-toggle" onclick="document.getElementById('navLinks').classList.toggle('open')">☰</button>
    </nav>

    <main class="page-content container">

        <section class="section" style="padding-top:2rem;">
            <div class="profile-header" id="profileHeader" style="border-bottom:none;padding-bottom:0;">

                <!-- Clickable avatar with edit overlay -->
                <div class="avatar-upload-wrap" title="Click to change profile picture">
                    <div class="profile-avatar" id="profileAvatar">U</div>
                    <div class="avatar-edit-overlay">📷</div>
                    <input type="file" id="editPictureFile" accept="image/*" onchange="previewAvatar(this)">
                </div>

                <div class="profile-info">
                    <h1 id="profileName" style="font-size:1.8rem;margin-bottom:0.2rem;">Loading…</h1>
                    <p class="text-muted" style="font-size:0.85rem;margin-bottom:0.3rem;" id="profileEmail"></p>
                    <p id="profileBioDisplay" class="profile-bio" style="font-size:0.85rem;color:var(--text-3);"></p>
                    <div id="socialLinksDisplay" style="display:flex;gap:0.75rem;margin:0.4rem 0;"></div>
                    <div class="profile-meta">
                        <span class="badge badge-accent" id="profileRole">USER</span>
                        <span id="profileJoined" style="font-size:0.75rem;color:var(--text-4);"></span>
                    </div>
                </div>
            </div>
            <!-- Upload progress bar under avatar -->
            <div class="pic-upload-bar" id="picUploadBar" style="width:110px;margin-top:6px;">
                <div class="pic-upload-bar-fill" id="picUploadFill"></div>
            </div>
            <p id="picUploadStatus" style="font-size:0.7rem;color:var(--text-3);margin-top:4px;"></p>
        </section>

        <div class="tabs" style="margin-bottom:1rem;">
            <button class="tab active" onclick="showProfileTab('profile', this)">Profile Details</button>
            <button class="tab" onclick="showProfileTab('history', this)">Listening History</button>
        </div>

        <div id="tabProfile">
            <section class="section">
                <div class="dash-grid">
                    <div class="stat-card">
                        <div class="stat-label">Playlists</div>
                        <div class="stat-value" id="statPlaylists">—</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Favorites</div>
                        <div class="stat-value" id="statFavorites">—</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">Listened</div>
                        <div class="stat-value" id="statListening">—</div>
                    </div>
                </div>
            </section>

            <section class="section" style="max-width:500px; padding-bottom: 3rem;">
                <h2 class="mb-2">Edit Profile</h2>
                <form id="profileForm" onsubmit="updateProfile(event)">
                    <div class="form-group"><label>Display Name</label><input type="text" id="editDisplayName"
                            class="form-control" placeholder="Name"></div>
                    <div class="form-group"><label>Bio</label><textarea id="editBio" class="form-control" rows="3"
                            placeholder="About you"></textarea></div>

                    <div class="form-group" id="socialLinksGroup" style="display:none;">
                        <label>Instagram Link (Optional)</label>
                        <input type="url" id="editInstagram" class="form-control"
                            placeholder="https://instagram.com/yourhandle">
                        <label style="margin-top:0.5rem;">YouTube Link (Optional)</label>
                        <input type="url" id="editYoutube" class="form-control"
                            placeholder="https://youtube.com/c/yourchannel">
                    </div>

                    <div class="auth-divider">Security</div>
                    <div class="form-group">
                        <label>Security Question</label>
                        <input type="text" id="editSecurityQuestion" class="form-control"
                            placeholder="e.g. What is your pet's name?">
                    </div>
                    <div class="form-group">
                        <label>Security Answer</label>
                        <input type="password" id="editSecurityAnswer" class="form-control"
                            placeholder="Leave blank to keep current">
                    </div>
                    <div class="form-group">
                        <label>Current Password</label>
                        <input type="password" id="editCurrentPassword" class="form-control"
                            placeholder="Required to change password">
                    </div>
                    <div class="form-group">
                        <label>New Password (Optional)</label>
                        <input type="password" id="editPassword" class="form-control"
                            placeholder="Leave blank to keep current">
                    </div>
                    <button type="submit" class="btn btn-primary" id="saveProfileBtn">Save Changes</button>
                </form>

                <div style="margin-top:3rem; padding-top:2rem; border-top: 1px solid var(--border-3);">
                    <div style="display:flex; gap:1rem;">
                        <button class="btn btn-secondary" onclick="logout()">Sign Out</button>
                        <button class="btn btn-ghost" style="color:var(--text-4);font-size:0.8rem;"
                            onclick="deleteAccount()">Delete Account</button>
                    </div>
                </div>
            </section>
        </div>

        <div id="tabHistory" class="hidden">
            <section class="section">
                <div class="section-header">
                    <h2>Listening History</h2>
                    <button class="btn btn-ghost btn-sm" onclick="clearProfileHistory()">Clear History</button>
                </div>
                <div class="grid grid-5" id="profileHistoryList">
                    <div class="empty-state" style="grid-column:1/-1;">
                        <div class="empty-icon">🎶</div>
                        <p>No listening history yet.</p>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div th:replace="~{fragments/player :: playerBar}"></div>
    <div th:replace="~{fragments/modals :: modals}"></div>
    <div th:replace="~{fragments/footer :: footerBase}"></div>
    <script th:src="@{/js/app.js}"></script>
    <script>
        // Tracks the currently saved profile picture URL (filename from server)
        let currentProfilePicture = '';
        // Tracks whether a new file was picked but not yet uploaded
        let pendingPicFile = null;

        function initPage() {
            const user = getUser();
            if (!user) return window.location.replace('/login');

            // Render from local cache immediately
            document.getElementById('profileName').textContent = user.displayName || user.username || 'User';
            document.getElementById('profileEmail').textContent = user.email || '';
            document.getElementById('profileRole').textContent = (user.role || 'user').toUpperCase();
            renderAvatar(user.profilePicture, user.displayName || user.username);

            loadStats();
            loadProfile();
            loadProfileHistory();
        }

        initPage();

        /* ── Avatar helpers ─────────────────────────────────────── */
        function resolveUrl(pic) {
            if (!pic) return '';
            if (pic.startsWith('/') || pic.startsWith('http')) return pic;
            return '/uploads/' + pic;
        }

        function renderAvatar(pic, name) {
            const el = document.getElementById('profileAvatar');
            if (pic) {
                const url = resolveUrl(pic);
                const bust = url.includes('?') ? '&v=' : '?v=' + Date.now();
                el.innerHTML = `<img src="${url}${bust}" data-retries="0" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" onerror="if(this.dataset.retries < 5){ this.dataset.retries++; setTimeout(()=>this.src='${url}${bust}', 500); } else { this.parentElement.textContent='${(name || 'U').charAt(0).toUpperCase()}'; }">`;
            } else {
                el.textContent = (name || 'U').charAt(0).toUpperCase();
            }
        }

        function renderNavAvatar(pic, name) {
            const el = document.getElementById('userAvatar');
            if (!el) return;
            if (pic) {
                const url = resolveUrl(pic);
                const bust = url.includes('?') ? '&v=' : '?v=' + Date.now();
                el.innerHTML = `<img src="${url}${bust}" data-retries="0" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" onerror="if(this.dataset.retries < 5){ this.dataset.retries++; setTimeout(()=>this.src='${url}${bust}', 500); } else { this.textContent='${(name || 'U').charAt(0).toUpperCase()}'; }">`;
            } else {
                el.textContent = (name || 'U').charAt(0).toUpperCase();
            }
        }

        /* Called immediately when user picks a file — shows live preview */
        function previewAvatar(input) {
            if (!input.files || !input.files[0]) return;
            pendingPicFile = input.files[0];
            const reader = new FileReader();
            reader.onload = (e) => {
                const el = document.getElementById('profileAvatar');
                el.innerHTML = `<img src="${e.target.result}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;">`;
            };
            reader.readAsDataURL(pendingPicFile);
            showToast('Picture selected — click Save Changes to upload', 'success');
        }

        /* ── Data loaders ───────────────────────────────────────── */
        function showProfileTab(tab, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('tabProfile').classList.toggle('hidden', tab !== 'profile');
            document.getElementById('tabHistory').classList.toggle('hidden', tab !== 'history');
        }

        async function loadProfileHistory() {
            const user = getUser();
            const grid = document.getElementById('profileHistoryList');
            try {
                const data = await api(`/api/listening-history/user/${user.userId}/recent?limit=25`);
                grid.innerHTML = data && data.length ? data.map(h => ui.card(h, 'song')).join('') : ui.empty('🎶', 'No history yet.');
            } catch (e) { grid.innerHTML = ui.empty('⚠️', 'Failed to load history.'); }
        }

        async function clearProfileHistory() {
            const user = getUser();
            if (!user || !confirm('Clear all listening history?')) return;
            try {
                await fetch(`/api/listening-history/user/${user.userId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': 'Bearer ' + localStorage.getItem('token') }
                });
                loadProfileHistory();
                showToast('History cleared');
            } catch (e) { showToast('Failed', 'error'); }
        }

        async function loadStats() {
            const user = getUser();
            try {
                const d = await api(`/api/analytics/user/${user.userId}/stats`);
                document.getElementById('statPlaylists').textContent = d.totalPlaylists;
                document.getElementById('statFavorites').textContent = d.totalFavorites;
                document.getElementById('statListening').textContent = d.totalListeningCount;
            } catch (e) { }
        }

        async function loadProfile() {
            const user = getUser();
            try {
                const d = await api(`/api/users/${user.userId}`);
                document.getElementById('editDisplayName').value = d.displayName || '';
                document.getElementById('editBio').value = d.bio || '';
                document.getElementById('profileBioDisplay').textContent = d.bio || '';
                document.getElementById('editSecurityQuestion').value = d.securityQuestion || '';
                currentProfilePicture = d.profilePicture || '';

                // Render saved profile picture
                renderAvatar(currentProfilePicture, d.displayName || d.username);

                // Artist social links
                if (user.role === 'artist' && user.artistProfileId) {
                    try {
                        const ad = await api(`/api/artists/${user.artistProfileId}`);
                        let socialHtml = '';
                        if (ad.instagramLink) {
                            socialHtml += `<a href="${ad.instagramLink}" target="_blank" style="color:var(--text-3);font-size:1.2rem;text-decoration:none;">📷</a>`;
                            document.getElementById('editInstagram').value = ad.instagramLink;
                        }
                        if (ad.youtubeLink) {
                            socialHtml += `<a href="${ad.youtubeLink}" target="_blank" style="color:var(--text-3);font-size:1.2rem;text-decoration:none;">📺</a>`;
                            document.getElementById('editYoutube').value = ad.youtubeLink;
                        }
                        document.getElementById('socialLinksDisplay').innerHTML = socialHtml;
                        document.getElementById('socialLinksGroup').style.display = 'block';
                    } catch (e) { }
                }
            } catch (e) { }
        }

        /* ── Profile picture upload with XHR for progress ───────── */
        async function uploadProfilePicture(file) {
            return new Promise((resolve, reject) => {
                const bar = document.getElementById('picUploadBar');
                const fill = document.getElementById('picUploadFill');
                const status = document.getElementById('picUploadStatus');

                bar.style.display = 'block';
                fill.style.width = '0%';
                status.textContent = 'Uploading…';

                const formData = new FormData();
                formData.append('file', file);

                const xhr = new XMLHttpRequest();
                xhr.open('POST', '/api/upload/profile-photo');
                xhr.setRequestHeader('Authorization', 'Bearer ' + localStorage.getItem('token'));

                xhr.upload.onprogress = (ev) => {
                    if (ev.lengthComputable) {
                        const pct = Math.round((ev.loaded / ev.total) * 100);
                        fill.style.width = pct + '%';
                        status.textContent = `Uploading… ${pct}%`;
                    }
                };

                xhr.onload = () => {
                    bar.style.display = 'none';
                    status.textContent = '';
                    if (xhr.status >= 200 && xhr.status < 300) {
                        const data = JSON.parse(xhr.responseText);
                        resolve(data.url); // server returns filename only
                    } else {
                        reject(new Error('Upload failed: ' + xhr.status));
                    }
                };

                xhr.onerror = () => {
                    bar.style.display = 'none';
                    status.textContent = '';
                    reject(new Error('Network error during upload'));
                };

                xhr.send(formData);
            });
        }

        /* ── Save profile ───────────────────────────────────────── */
        async function updateProfile(e) {
            e.preventDefault();
            const user = getUser();
            const btn = document.getElementById('saveProfileBtn');
            btn.disabled = true;
            btn.textContent = 'Saving…';

            try {
                // 1. Upload profile picture if a new file was picked
                if (pendingPicFile) {
                    try {
                        const filename = await uploadProfilePicture(pendingPicFile);
                        currentProfilePicture = filename; // server returns bare filename
                        pendingPicFile = null;
                    } catch (upErr) {
                        showToast('Picture upload failed: ' + upErr.message, 'error');
                        btn.disabled = false;
                        btn.textContent = 'Save Changes';
                        return;
                    }
                }

                // 2. Save user data
                const displayName = document.getElementById('editDisplayName').value.trim();
                const bio = document.getElementById('editBio').value.trim();
                const pw = document.getElementById('editPassword').value;
                const currentPw = document.getElementById('editCurrentPassword').value;

                // Validate: if new password given, current password is required
                if (pw && !currentPw) {
                    showToast('Please enter your current password to set a new one', 'error');
                    btn.disabled = false;
                    btn.textContent = 'Save Changes';
                    return;
                }

                const payload = {
                    email: user.email,
                    username: user.username,
                    password: pw || '',
                    currentPassword: currentPw || '',
                    role: user.role,
                    fullName: displayName,
                    displayName: displayName,
                    bio: bio,
                    profilePicture: currentProfilePicture,
                    securityQuestion: document.getElementById('editSecurityQuestion').value.trim() || null,
                    securityAnswer: document.getElementById('editSecurityAnswer').value.trim() || null
                };

                await api(`/api/users/${user.userId}`, 'PUT', payload);

                // 3. Save artist socials (no banner)
                if (user.role === 'artist' && user.artistProfileId) {
                    try {
                        const artistPayload = { userId: user.userId };
                        const instaEl = document.getElementById('editInstagram');
                        const ytEl = document.getElementById('editYoutube');
                        if (instaEl) artistPayload.instagramLink = instaEl.value.trim();
                        if (ytEl) artistPayload.youtubeLink = ytEl.value.trim();
                        await api(`/api/artists/${user.artistProfileId}`, 'PUT', artistPayload);
                    } catch (err) { console.error('Artist save error:', err); }
                }

                // 4. Update UI immediately
                document.getElementById('profileName').textContent = displayName || user.username;
                document.getElementById('profileBioDisplay').textContent = bio;
                renderAvatar(currentProfilePicture, displayName || user.username);
                renderNavAvatar(currentProfilePicture, displayName || user.username);

                // 5. Persist to localStorage so all pages see the updated picture
                const updatedUser = Object.assign({}, user, {
                    displayName: displayName,
                    profilePicture: currentProfilePicture,
                    bio: bio
                });
                localStorage.setItem('user', JSON.stringify(updatedUser));

                document.getElementById('editPassword').value = '';
                document.getElementById('editCurrentPassword').value = '';
                showToast('Profile updated successfully!', 'success');

            } catch (err) {
                showToast('Failed to save profile', 'error');
                console.error(err);
            }

            btn.disabled = false;
            btn.textContent = 'Save Changes';
        }

        async function deleteAccount() {
            const user = getUser();
            if (!user || !confirm('WARNING: THIS IS PERMANENT. Are you absolutely sure?')) return;
            try {
                await api(`/api/users/${user.userId}`, 'DELETE');
                alert('Account deleted.');
                logout();
            } catch (e) { showToast('Failed to delete account', 'error'); }
        }
    </script>
</body>

</html>
