<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcast — RevPlay</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script>if (!localStorage.getItem('user')) window.location.replace('/login');</script>
</head>

<body class="">

    <nav class="navbar">
        <a href="/home" class="logo">
            <img th:src="@{/images/logo.png}" alt="Logo"
                style="width: 32px; height: 32px; border-radius: 4px; filter: invert(1);"> RevPlay
        </a>
        <div class="nav-links" id="navLinks">
            <a href="/home">Home</a>
            <a href="/browse">Browse</a>
            <a href="/podcasts">Podcasts</a>
            <a href="/playlists">Playlists</a>
            <a href="/favorites">Favorites</a>
            <a href="/artist-dashboard" id="dashboardLink">Dashboard</a>
        </div>
        <div class="nav-search">
            <input type="text" id="searchInput" name="search" placeholder="Search songs..."
                onkeydown="if(event.key==='Enter') handleUniversalSearch(this.value)">
        </div>
        <div class="nav-actions"><a href="/profile" class="user-avatar" id="userAvatar">U</a></div>
        <button class="menu-toggle" onclick="document.getElementById('navLinks').classList.toggle('open')">☰</button>
    </nav>

    <main class="page-content container">

        <section class="section" style="display:flex;gap:2rem;align-items:flex-end;margin-bottom:2rem;">
            <div id="podcastCover"
                style="width:200px;height:200px;background:var(--bg-3);border-radius:var(--radius-md);flex-shrink:0;box-shadow:var(--shadow-lg);overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:4rem;color:var(--text-4);">
                🎙️</div>
            <div>
                <span class="badge badge-accent" style="margin-bottom:0.5rem;display:inline-block;">PODCAST</span>
                <h1 id="podcastTitle" style="font-size:3rem;margin:0 0 0.5rem;line-height:1.1;">&nbsp;</h1>
                <p id="podcastArtist" style="font-size:1.1rem;color:var(--text-2);margin:0 0 1rem;"></p>
                <div id="podcastDesc" class="text-muted" style="font-size:0.9rem;max-width:600px;"></div>
                <div style="margin-top:1.5rem;display:flex;gap:1rem;align-items:center;flex-wrap:wrap;">
                    <button class="btn btn-primary" style="border-radius:30px;padding:0.6rem 2rem;font-weight:600;"
                        onclick="playFirstEpisode()">Play First Episode</button>
                    <div id="ownerControls" style="display:none;gap:0.75rem;">
                        <button class="btn btn-secondary" onclick="showModal('addEpisodeModal')">+ Add Episode</button>
                        <button class="btn btn-secondary" onclick="editPodcast()">✏️ Edit Podcast</button>
                        <button class="btn btn-secondary" onclick="deletePodcast()" style="color:var(--danger);">✕
                            Delete Podcast</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="section">
            <h3 style="margin-bottom:1rem;font-size:1.25rem;">Episodes</h3>
            <div id="episodesList" style="display:flex;flex-direction:column;gap:0.5rem;"></div>
        </section>

    </main>

    <!-- Add Episode Modal -->
    <div class="modal-backdrop" id="addEpisodeModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Upload Episode</h3><button class="modal-close" onclick="hideModal('addEpisodeModal')">✕</button>
            </div>
            <form onsubmit="addEpisode(event)">
                <div class="form-group"><label>Title</label><input type="text" id="epTitle" class="form-control"
                        placeholder="Episode Title" required></div>
                <div class="form-group"><label>Description</label><textarea id="epDesc" class="form-control" rows="3"
                        placeholder="What is this episode about?"></textarea></div>
                <div class="form-group"><label>Release Date</label><input type="date" id="epDate" class="form-control"
                        required></div>
                <div class="form-group">
                    <label>Audio File</label>
                    <div id="fileUploadMode">
                        <input type="file" id="epFile" class="form-control" accept=".mp3,.wav,.ogg,.m4a"
                            style="padding:0.5rem;">
                        <p style="font-size:0.75rem;color:var(--text-3);margin-top:0.3rem;">Max 100MB · <a href="#"
                                onclick="toggleUploadMode(event)" style="color:var(--accent);">Or paste URL</a></p>
                    </div>
                    <div id="urlUploadMode" class="hidden">
                        <input type="url" id="epUrl" class="form-control" placeholder="https://...">
                        <p style="font-size:0.75rem;color:var(--text-3);margin-top:0.3rem;"><a href="#"
                                onclick="toggleUploadMode(event)" style="color:var(--accent);">← Upload a file
                                instead</a></p>
                    </div>
                    <div id="uploadProgress" class="hidden" style="margin-top:0.5rem;">
                        <div
                            style="background:var(--bg-3);border-radius:var(--radius-full);height:6px;overflow:hidden;">
                            <div id="uploadBar"
                                style="height:100%;background:var(--accent);width:0%;transition:width 0.3s;"></div>
                        </div>
                        <p style="font-size:0.7rem;color:var(--text-3);margin-top:0.2rem;" id="uploadStatus">Uploading…
                        </p>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-full">Upload</button>
            </form>
        </div>
    </div>

    <!-- Edit Podcast Modal -->
    <div class="modal-backdrop" id="editPodcastModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Edit Podcast</h3><button class="modal-close" onclick="hideModal('editPodcastModal')">✕</button>
            </div>
            <form onsubmit="updatePodcast(event)">
                <input type="hidden" id="editPodcastId">
                <div class="form-group"><label>Title</label><input type="text" id="editPodcastTitleField"
                        class="form-control" required></div>
                <div class="form-group"><label>Description</label><textarea id="editPodcastDescField"
                        class="form-control" rows="3"></textarea></div>
                <div class="form-group"><label>Cover Image URL (optional)</label><input type="url" id="editPodcastCover"
                        class="form-control"></div>
                <button type="submit" class="btn btn-primary w-full">Save Changes</button>
            </form>
        </div>
    </div>

    <!-- Edit Episode Modal -->
    <div class="modal-backdrop" id="editEpisodeModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Edit Episode</h3><button class="modal-close" onclick="hideModal('editEpisodeModal')">✕</button>
            </div>
            <form onsubmit="updateEpisode(event)">
                <input type="hidden" id="editEpisodeId">
                <div class="form-group"><label>Title</label><input type="text" id="editEpTitle" class="form-control"
                        required></div>
                <div class="form-group"><label>Description</label><textarea id="editEpDesc" class="form-control"
                        rows="3"></textarea></div>
                <div class="form-group"><label>Release Date</label><input type="date" id="editEpDate"
                        class="form-control" required></div>
                <div class="form-group"><label>Audio URL</label><input type="url" id="editEpUrl" class="form-control"
                        required></div>
                <button type="submit" class="btn btn-primary w-full">Save Changes</button>
            </form>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footerBase}"></div>
    <div th:replace="~{fragments/player :: playerBar}"></div>
    <div th:replace="~{fragments/modals :: modals}"></div>

    <script th:src="@{/js/app.js}"></script>
    <script>
        var episodesData = [];
        var podcastData = null;

        function initPage() {
            const user = getUser();
            if (!user) return window.location.replace('/login');
            loadPodcast();
        }

        initPage();

        async function loadPodcast() {
            const podcastId = window.location.pathname.split('/').pop();
            const user = getUser();
            try {
                podcastData = await api(`/api/podcasts/${podcastId}`);
                document.getElementById('podcastTitle').textContent = podcastData.title;
                document.getElementById('podcastArtist').textContent = podcastData.artistName || 'Creator';
                document.getElementById('podcastDesc').textContent = podcastData.description || '';

                const coverEl = document.getElementById('podcastCover');
                if (podcastData.coverImage) {
                    coverEl.innerHTML = `<img src="${podcastData.coverImage}" style="width:100%;height:100%;object-fit:cover;">`;
                } else {
                    coverEl.innerHTML = '🎙️';
                }

                if (user && user.role === 'artist' && user.artistProfileId == podcastData.artistId) {
                    document.getElementById('ownerControls').style.display = 'flex';
                }

                loadEpisodes();
            } catch (err) {
                document.getElementById('podcastTitle').textContent = 'Not Found';
                document.getElementById('episodesList').innerHTML = ui.empty('🎙️', 'Podcast not found.');
            }
        }

        async function loadEpisodes() {
            const podcastId = window.location.pathname.split('/').pop();
            const user = getUser();
            try {
                episodesData = await api(`/api/podcast-episodes/podcast/${podcastId}`);
                const list = document.getElementById('episodesList');
                if (!episodesData || !episodesData.length) {
                    list.innerHTML = ui.empty('🎙️', 'No episodes yet.');
                    return;
                }
                const isOwner = user && user.role === 'artist' && user.artistProfileId == podcastData.artistId;
                list.innerHTML = episodesData.map((ep, i) => {
                    const s = { id: ep.id + 100000, title: ep.title, artistName: ep.releaseDate || 'Unknown Date', audioUrl: ep.audioUrl, duration: ep.duration };
                    let row = ui.songRow(s, i);
                    row = row.replace('onclick="playSong', 'onclick="playEpisode');
                    if (isOwner) {
                        row = row.replace('<button class="btn-add-playlist"',
                            `<button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();editEpisode(${ep.id})" title="Edit">✏️</button>
                                <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();deleteEpisode(${ep.id})" title="Delete">✕</button>
                                <button class="btn-add-playlist"`);
                    }
                    return row;
                }).join('');
            } catch (err) { list.innerHTML = ui.empty('⚠️', 'Could not load episodes.'); }
        }

        function playEpisode(epId) {
            const ep = episodesData.find(e => e.id + 100000 === epId);
            if (!ep || !ep.audioUrl) return showToast('Audio not available', 'error');
            playSong(ep.id + 100000, ep.title, podcastData ? podcastData.title : 'Podcast', ep.audioUrl, podcastData ? podcastData.coverImage : null);
        }

        function playFirstEpisode() {
            if (episodesData.length) playEpisode(episodesData[0].id + 100000);
            else showToast('No episodes', 'error');
        }

        function toggleUploadMode(e) {
            e.preventDefault();
            document.getElementById('fileUploadMode').classList.toggle('hidden');
            document.getElementById('urlUploadMode').classList.toggle('hidden');
        }

        async function addEpisode(e) {
            e.preventDefault();
            const podcastId = window.location.pathname.split('/').pop();
            const btn = e.target.querySelector('button[type=submit]');
            btn.disabled = true; btn.textContent = 'Uploading…';
            try {
                let audioUrl = '';
                let durationPayload = 0;
                const fileInput = document.getElementById('epFile');
                const urlInput = document.getElementById('epUrl');
                const isFileMode = !document.getElementById('fileUploadMode').classList.contains('hidden');

                if (isFileMode && fileInput.files.length > 0) {
                    const formData = new FormData();
                    formData.append('file', fileInput.files[0]);
                    document.getElementById('uploadProgress').classList.remove('hidden');

                    audioUrl = await new Promise((resolve, reject) => {
                        const xhr = new XMLHttpRequest();
                        xhr.open('POST', '/api/upload/podcast');
                        xhr.setRequestHeader('Authorization', 'Bearer ' + localStorage.getItem('token'));

                        xhr.upload.onprogress = (event) => {
                            if (event.lengthComputable) {
                                const percent = (event.loaded / event.total) * 100;
                                document.getElementById('uploadBar').style.width = percent + '%';
                                document.getElementById('uploadStatus').textContent = 'Uploading...';
                            }
                        };

                        xhr.onload = () => {
                            if (xhr.status >= 200 && xhr.status < 300) {
                                const data = JSON.parse(xhr.responseText);
                                document.getElementById('uploadBar').style.width = '100%';
                                document.getElementById('uploadStatus').textContent = 'Finalizing...';
                                resolve(data.url);
                            } else {
                                const err = JSON.parse(xhr.responseText || '{}');
                                reject(new Error(err.error || 'Upload failed'));
                            }
                        };

                        xhr.onerror = () => reject(new Error('Network error during upload'));
                        xhr.send(formData);
                    });

                    // Extract duration from the uploaded file's server URL
                    durationPayload = await new Promise((resolve) => {
                        const tempAudio = new Audio(audioUrl);
                        tempAudio.addEventListener('loadedmetadata', () => {
                            resolve(Math.round(tempAudio.duration));
                        });
                        tempAudio.addEventListener('error', () => resolve(0));
                    });
                } else { audioUrl = urlInput.value.trim(); }

                if (!audioUrl) throw new Error('No audio URL');

                await api('/api/podcast-episodes', 'POST', {
                    podcastId: podcastId,
                    title: document.getElementById('epTitle').value.trim(),
                    description: document.getElementById('epDesc').value.trim(),
                    audioUrl: audioUrl,
                    duration: durationPayload,
                    releaseDate: document.getElementById('epDate').value
                });
                hideModal('addEpisodeModal');
                loadEpisodes();
                showToast('Uploaded!');
                e.target.reset();
            } catch (err) { showToast(err.message, 'error'); }
            btn.disabled = false; btn.textContent = 'Upload';
        }

        async function deleteEpisode(id) {
            if (!confirm('Delete episode?')) return;
            try {
                await api(`/api/podcast-episodes/${id}`, 'DELETE');
                showToast('Deleted');
                loadEpisodes();
            } catch (err) { showToast('Failed', 'error'); }
        }

        async function editPodcast() {
            try {
                document.getElementById('editPodcastId').value = podcastData.id;
                document.getElementById('editPodcastTitleField').value = podcastData.title || '';
                document.getElementById('editPodcastDescField').value = podcastData.description || '';
                document.getElementById('editPodcastCover').value = podcastData.coverImage || '';
                showModal('editPodcastModal');
            } catch (e) { }
        }

        async function updatePodcast(e) {
            e.preventDefault();
            const id = document.getElementById('editPodcastId').value;
            const user = getUser();
            const btn = e.target.querySelector('button[type=submit]');
            btn.disabled = true; btn.textContent = 'Saving...';
            try {
                await api(`/api/podcasts/${id}`, 'PUT', {
                    artistId: user.artistProfileId,
                    title: document.getElementById('editPodcastTitleField').value.trim(),
                    description: document.getElementById('editPodcastDescField').value.trim(),
                    coverImage: document.getElementById('editPodcastCover').value.trim() || null
                });
                hideModal('editPodcastModal');
                showToast('Podcast updated!');
                loadPodcast();
            } catch (err) { showToast('Update failed', 'error'); }
            btn.disabled = false; btn.textContent = 'Save Changes';
        }

        async function deletePodcast() {
            if (!confirm('Delete this podcast and all its episodes?')) return;
            const id = window.location.pathname.split('/').pop();
            try {
                await api(`/api/podcasts/${id}`, 'DELETE');
                showToast('Podcast deleted');
                window.location.href = '/artist-dashboard';
            } catch (err) { showToast('Failed to delete', 'error'); }
        }

        async function editEpisode(id) {
            try {
                const ep = episodesData.find(e => e.id === id);
                document.getElementById('editEpisodeId').value = ep.id;
                document.getElementById('editEpTitle').value = ep.title || '';
                document.getElementById('editEpDesc').value = ep.description || '';
                document.getElementById('editEpDate').value = ep.releaseDate || '';
                document.getElementById('editEpUrl').value = ep.audioUrl || '';
                showModal('editEpisodeModal');
            } catch (e) { }
        }

        async function updateEpisode(e) {
            e.preventDefault();
            const id = document.getElementById('editEpisodeId').value;
            const podcastId = window.location.pathname.split('/').pop();
            const btn = e.target.querySelector('button[type=submit]');
            btn.disabled = true; btn.textContent = 'Saving...';
            try {
                await api(`/api/podcast-episodes/${id}`, 'PUT', {
                    podcastId: podcastId,
                    title: document.getElementById('editEpTitle').value.trim(),
                    description: document.getElementById('editEpDesc').value.trim(),
                    audioUrl: document.getElementById('editEpUrl').value.trim(),
                    releaseDate: document.getElementById('editEpDate').value
                });
                hideModal('editEpisodeModal');
                showToast('Episode updated!');
                loadEpisodes();
            } catch (err) { showToast('Update failed', 'error'); }
            btn.disabled = false; btn.textContent = 'Save Changes';
        }
    </script>
</body>

</html>
