<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RevPlay — Music Streaming</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <a href="/" class="logo">
            <img th:src="@{/images/logo.png}" alt="Logo"
                style="width: 32px; height: 32px; border-radius: 4px; filter: invert(1);"> RevPlay
        </a>
        <div class="nav-links" id="navLinks">
            <a href="/login" class="nav-auth-link">Login</a>
            <a href="/register" class="btn btn-primary btn-sm nav-auth-link">Get Started</a>
        </div>
        <button class="menu-toggle" onclick="document.getElementById('navLinks').classList.toggle('open')">☰</button>
    </nav>

    <!-- Hero -->
    <section class="hero page-content"
        style="min-height: calc(100vh - 80px); display: flex; flex-direction: column; justify-content: center;">
        <h1>
            Music that<br><span>moves with you</span>
        </h1>
        <p class="hero-tagline"
            style="font-size:0.9rem;letter-spacing:0.25em;text-transform:uppercase;color:var(--accent);margin-bottom:1.5rem;font-weight:600;">
            Music Heals</p>
        <p>
            Stream millions of songs, discover new artists, and build your perfect soundtrack.
        </p>
        <div class="hero-actions">
            <a href="/register" class="btn btn-primary btn-lg">Start Free</a>
            <a href="/login" class="btn btn-secondary btn-lg">Explore</a>
        </div>
    </section>

    <footer
        style="text-align:center;padding:2rem 1rem;color:var(--text-3);font-size:0.85rem;border-top:1px solid var(--border-1);">
        RevPlay &copy; 2026. All rights reserved.
    </footer>
</body>

</html>
