<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — RevPlay</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div class="auth-page">
        <div class="auth-card animate-slide">
            <div class="auth-logo">
                <a href="/" class="logo" style="justify-content:center;"><span class="logo-mark"><span
                            class="eq-bar"></span><span class="eq-bar"></span><span class="eq-bar"></span><span
                            class="eq-bar"></span></span> RevPlay</a>
            </div>

            <div id="loginError" class="hidden"
                style="background:rgba(255,111,111,0.06);border:1px solid rgba(255,111,111,0.2);border-radius:var(--radius-sm);padding:0.7rem 0.9rem;margin-bottom:1rem;font-size:0.8rem;color:#ff8888;">
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label>Email or Username</label>
                    <input type="text" id="loginIdentifier" class="form-control" placeholder="you@email.com" required>
                </div>
                <div class="form-group">
                    <div style="display:flex;justify-content:space-between;align-items:baseline;">
                        <label>Password</label>
                        <a href="/forgot-password"
                            style="font-size:0.75rem;color:var(--text-3);text-decoration:underline;">Forgot?</a>
                    </div>
                    <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" id="loginBtn">Sign In</button>
            </form>

            <div class="auth-footer">
                New here? <a href="/register">Create an account</a>
            </div>
        </div>
    </div>

    <script th:src="@{/js/app.js}"></script>
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('loginIdentifier').value.trim();
            const password = document.getElementById('loginPassword').value;
            const errorBox = document.getElementById('loginError');
            const btn = document.getElementById('loginBtn');

            errorBox.classList.add('hidden');
            btn.textContent = 'Signing in…';
            btn.disabled = true;

            const isEmail = identifier.includes('@');
            const body = { password };
            if (isEmail) body.email = identifier; else body.username = identifier;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const apiRes = await res.json();
                const data = apiRes.data || apiRes; // Support both raw AuthResponse and wrapped ApiResponse

                if (res.ok && data.authenticated) {
                    localStorage.setItem('user', JSON.stringify(data));
                    if (data.token) localStorage.setItem('token', data.token);
                    window.location.href = data.role === 'artist' ? '/artist-dashboard' : '/home';
                } else {
                    errorBox.textContent = data.message || 'Invalid credentials';
                    errorBox.classList.remove('hidden');
                }
            } catch {
                errorBox.textContent = 'Connection error. Try again.';
                errorBox.classList.remove('hidden');
            }
            btn.textContent = 'Sign In';
            btn.disabled = false;
        }
    </script>

</body>

</html>
