<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="modals">
    <!-- Add to Playlist Modal -->
    <div class="modal-backdrop" id="addToPlaylistModal">
        <div class="modal">
            <div class="modal-header">
                <h3>Select Playlist</h3>
                <button class="modal-close" onclick="hideModal('addToPlaylistModal')">✕</button>
            </div>
            <div id="modalPlaylistsList">
                <div class="empty-state">
                    <div class="empty-icon">📋</div>
                    <p>Loading playlists...</p>
                </div>
            </div>
            <div class="mt-2" style="text-align:center;">
                <button class="btn btn-ghost btn-sm"
                    onclick="hideModal('addToPlaylistModal');showModal('createPlaylistModal')">+ Create New
                    Playlist</button>
            </div>
        </div>
        <!-- Create Playlist Modal -->
        <div class="modal-backdrop" id="createPlaylistModal">
            <div class="modal">
                <div class="modal-header">
                    <h3>Create Playlist</h3><button class="modal-close"
                        onclick="hideModal('createPlaylistModal')">✕</button>
                </div>
                <form onsubmit="createPlaylist(event)">
                    <div class="form-group"><label>Name</label><input type="text" id="playlistName" class="form-control"
                            placeholder="My Playlist" required></div>
                    <div class="form-group"><label>Description</label><textarea id="playlistDesc" class="form-control"
                            rows="3" placeholder="Optional description"></textarea></div>
                    <div class="form-group"><label>Privacy</label><select id="playlistPrivacy" class="form-control">
                            <option value="private">Private</option>
                            <option value="public">Public</option>
                        </select></div>
                    <button type="submit" class="btn btn-primary w-full">Create</button>
                </form>
            </div>
        </div>
    </div>

</html>
