<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<div th:fragment="playerBar" class="player-bar" id="playerBar" style="display:none;">
    <div class="player-song">
        <div class="player-thumb" id="playerThumb"
            style="display:flex;align-items:center;justify-content:center;background:var(--bg-3);color:var(--text-3);font-size:1.5rem;">
            🎵</div>
        <div class="player-song-info">
            <div class="player-song-title" id="playerTitle">No song playing</div>
            <div class="player-song-artist" id="playerArtist">—</div>
        </div>
        <button class="player-btn text-muted" id="favoriteBtn" onclick="toggleFavorite()"
            style="margin-left:0.5rem;font-size:1.1rem;transition:color 0.2s;">♡</button>
        <button class="player-btn text-muted" id="addToPlaylistBtn" onclick="openAddToPlaylistModal()"
            style="margin-left:0.2rem;font-size:1rem;color:var(--text-3);" title="Add to Playlist">➕</button>
        <button class="player-btn text-muted" onclick="showQueue()"
            style="margin-left:0.2rem;font-size:0.9rem;color:var(--text-3);" title="View Queue">📋</button>
    </div>

    <div class="player-controls">
        <div class="player-buttons">
            <button class="player-btn text-muted" id="shuffleBtn" onclick="toggleShuffle()" style="font-size:0.9rem;"
                title="Shuffle">🔀 <span style="font-size:0.6rem;vertical-align:super;">OFF</span></button>
            <button class="player-btn" onclick="prevSong()" title="Previous">⏮</button>
            <button class="player-btn main-play" id="playPauseBtn" onclick="togglePlay()" title="Play/Pause">▶</button>
            <button class="player-btn" onclick="nextSong()" title="Next">⏭</button>
            <button class="player-btn text-muted" id="repeatBtn" onclick="toggleRepeat()" style="font-size:0.9rem;"
                title="Repeat">🔁 <span style="font-size:0.6rem;vertical-align:super;">OFF</span></button>
        </div>
        <div class="progress-bar">
            <span class="progress-time" id="currentTime">0:00</span>
            <div class="progress-track" onclick="seek(event)">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="progress-time" id="totalTime">0:00</span>
        </div>
    </div>

    <div class="player-volume">
        <span class="text-muted" style="font-size:0.85rem;">🔊</span>
        <div class="volume-slider">
            <div class="volume-fill"></div>
        </div>
    </div>
</div>

</html>
