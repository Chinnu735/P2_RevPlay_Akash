<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Podcasts — RevPlay</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script>if (!localStorage.getItem('user')) window.location.replace('/login');</script>
</head>

<body>

    <nav class="navbar">
        <a href="/home" class="logo">
            <img th:src="@{/images/logo.png}" alt="Logo"
                style="width: 32px; height: 32px; border-radius: 4px; filter: invert(1);"> RevPlay
        </a>
        <div class="nav-links" id="navLinks">
            <a href="/home">Home</a>
            <a href="/browse">Browse</a>
            <a href="/podcasts" class="active">Podcasts</a>
            <a href="/playlists">Playlists</a>
            <a href="/favorites">Favorites</a>
            <a href="/artist-dashboard" id="dashboardLink">Dashboard</a>
        </div>
        <div class="nav-search">
            <input type="text" id="searchInput" name="search" placeholder="Search songs..."
                onkeydown="if(event.key==='Enter') handleUniversalSearch(this.value)">
        </div>
        <div class="nav-actions"><a href="/profile" class="user-avatar" id="userAvatar">U</a></div>
        <button class="menu-toggle" onclick="document.getElementById('navLinks').classList.toggle('open')">☰</button>
    </nav>

    <main class="page-content container">

        <section class="section">
            <div class="section-header">
                <h2>All Podcasts</h2>
            </div>
            <div class="grid grid-4" id="podcastsGrid"></div>
        </section>

    </main>

    <div th:replace="~{fragments/footer :: footerBase}"></div>
    <div th:replace="~{fragments/player :: playerBar}"></div>
    <div th:replace="~{fragments/modals :: modals}"></div>

    <script th:src="@{/js/app.js}"></script>
    <script>
        function initPage() {
            const user = getUser();
            if (!user) return window.location.replace('/login');
            loadPodcasts();
        }

        initPage();

        async function loadPodcasts() {
            const grid = document.getElementById('podcastsGrid');
            try {
                const data = await api('/api/podcasts');
                grid.innerHTML = data && data.length
                    ? data.map(p => `
                        <a href="/podcast/${p.id}" class="card">
                            <div class="card-img" style="background:var(--bg-3);display:flex;align-items:center;justify-content:center;font-size:2rem;color:var(--text-4);">
                                ${p.coverImage ? `<img src="${p.coverImage}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';this.parentElement.innerHTML='🎙️'">` : '🎙️'}
                            </div>
                            <div class="card-body">
                                <div class="card-title">${p.title || ''}</div>
                                <div class="card-subtitle">${p.artistName || 'Creator'}</div>
                            </div>
                        </a>
                    `).join('')
                    : ui.empty('🎙️', 'No podcasts yet.');
            } catch (e) {
                grid.innerHTML = ui.empty('⚠️', 'Error loading podcasts.');
            }
        }
    </script>
</body>

</html>
